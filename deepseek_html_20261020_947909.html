<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вишлист</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #f1f1f2);
      color: var(--tg-theme-text-color, #131315);
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 24px; margin-bottom: 16px; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #fff);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--tg-theme-button-color, #2481cc);
      background: transparent;
      color: var(--tg-theme-button-color, #2481cc);
      font-size: 14px;
      cursor: pointer;
    }
    .btn.active {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    .btn-primary {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
    }
    .btn-primary:disabled { opacity: 0.5; }
    .hidden { display: none; }
    .hint { font-size: 13px; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>🎁 Вишлист</h1>
  <p id="greeting">Привет, гость!</p>

  <div class="card">
    <p><strong>📍 Куда доставлять</strong></p>
    <div class="btn-group">
      <button class="btn active" onclick="selectCategory(this, 'all')">Все</button>
      <button class="btn" onclick="selectCategory(this, 'available')">Доступные</button>
      <button class="btn" onclick="selectCategory(this, 'joint')">Совместные</button>
    </div>
  </div>

  <div id="emptyState" class="card">
    <p>📭 Подарков в этой категории пока нет</p>
    <p class="hint">Синхронизация с таблицей...</p>
  </div>

  <div class="card">
    <h3>Скинуться на подарок</h3>
    <p>Сумма взноса (₽):</p>
    <div class="btn-group" id="amountGroup">
      <button class="btn" onclick="selectAmount(this, 500)">+500 ₽</button>
      <button class="btn" onclick="selectAmount(this, 1000)">+1000 ₽</button>
      <button class="btn" onclick="selectAmount(this, 2000)">+2000 ₽</button>
    </div>
    <button class="btn-primary" id="submitBtn" onclick="submitContribution()" disabled>
      Подтвердить взнос
    </button>
    <p id="statusMsg" class="hint"></p>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/ВАШ_ID/exec';
    let selectedAmount = 0;
    let tgUser = null;

    // Инициализация Telegram WebApp
    if (window.Telegram?.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      
      if (tg.initDataUnsafe?.user) {
        tgUser = tg.initDataUnsafe.user;
        document.getElementById('greeting').textContent =
          `Привет, ${tgUser.first_name || 'гость'}!`;
      }
    }

    function selectCategory(btn, cat) {
      document.querySelectorAll('.btn-group:first-of-type .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Здесь можно загрузить данные с GAS doGet (фильтрация)
    }

    function selectAmount(btn, amount) {
      document.querySelectorAll('#amountGroup .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedAmount = amount;
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('statusMsg').textContent = '';
    }

    async function submitContribution() {
      if (!selectedAmount) return;

      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');
      btn.disabled = true;
      status.textContent = 'Отправка...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' }, // GAS требует text/plain чтобы избежать preflight
          body: JSON.stringify({
            userId: tgUser?.id || 'anonymous',
            amount: selectedAmount,
            itemName: 'Совместный подарок',
            initData: window.Telegram?.WebApp?.initData || ''
          })
        });
        const data = await res.json();
        
        if (data.ok) {
          status.textContent = `✅ Взнос ${selectedAmount} ₽ записан`;
          // Закрыть Mini App через 1.5 секунды
          setTimeout(() => window.Telegram?.WebApp?.close(), 1500);
        } else {
          status.textContent = `❌ Ошибка: ${data.error}`;
          btn.disabled = false;
        }
      } catch (err) {
        status.textContent = `❌ Сетевая ошибка: ${err.message}`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
